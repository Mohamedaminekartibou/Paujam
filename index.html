<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Incripció a la PauJam</title>
	<link rel="stylesheet" href="CSS/style.css">
</head>

<body>
	<section class="flexPrincipal">
		<section class="parteIzquierda">
			<div class="notififació">
				<p class="diferente">Obert per a Inscripcions</p>
			</div>

			<h2>El Gran Esdeveniment</h2>

			<p class="sutbitulo">Prepara't per viure una experiència inoblidable. Connecta, aprèn i gaudeix d'una
				jornada pensada exclusivament per a tu i el teu equip.</p>

			<div class="Data">
				<div class="Calendario">
					<img src="CSS/icono.png" alt="icono">
				</div>
				<div class="informacion">
					<p class="DATA">DATA</p>
					<p>Proximament</p>
				</div>
			</div>
		</section>
		<section class="parteFormulario">

			<h2>Reserva la teva plaça</h2>
			<p>Introdueix les teves dades a continuació.</p>

			<div class="form-group">
				<label>Nom complet *</label>
				<input type="text" placeholder="Escriu el teu nom">
			</div>

			<div class="form-group">
				<label>Correu electrònic *</label>
				<input type="email" placeholder="nom@exemple.com">
			</div>

			<div class="form-group">
				<label>Nom complet *</label>
				<input type="text" placeholder="Escriu el teu nom">
			</div>


			<div class="form-group">
				<label>Horari (Opcional)</label>
				<input type="time" placeholder="Horari de visita">
			</div>

			<div class="form-group">
				<label>Telèfon (Opcional)</label>
				<input type="text" placeholder="Mòbil de contacte">
			</div>

			<div class="row">
				<div class="form-group">
					<label>Acompanyants *</label>
					<input type="number" value="0">
				</div>
			</div>

			<div class="form-group">
				<label>Institut/Origen (Opcional)</label>
				<input type="text" placeholder="Ex: IES...">
			</div>

			<button>Confirmar Assistència →</button>

		</section>
	</section>
	<script></script>
</body>

</html>
